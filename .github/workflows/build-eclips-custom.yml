          package ru.eclips.custom;

          import cn.nukkit.level.Level;

          import java.io.File;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import java.util.HashMap;
          import java.util.Map;

          /**
           * Запоминает, какие поставленные блоки ТНТ являются кастомными.
           * Хранится на диске (plugins/EclipsCustom/placed.txt), переживает рестарт.
           * Запись на диск идёт в отдельном потоке.
           */
          public class PlacedStore {

              private final Map<String, String> map = new HashMap<>();
              private final File file;
              private boolean dirty = false;
              private final Object ioLock = new Object();

              public PlacedStore(EclipsCustom plugin) {
                  this.file = new File(plugin.getDataFolder(), "placed.txt");
              }

              public static String key(Level l, int x, int y, int z) {
                  return l.getFolderName() + "|" + x + "|" + y + "|" + z;
              }

              public void load() {
                  try {
                      if (file.getParentFile() != null) {
                          file.getParentFile().mkdirs();
                      }
                      if (!file.exists()) {
                          return;
                      }
                      for (String line : Files.readAllLines(file.toPath(), StandardCharsets.UTF_8)) {
                          int eq = line.lastIndexOf('=');
                          if (eq <= 0) {
                              continue;
                          }
                          map.put(line.substring(0, eq), line.substring(eq + 1));
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public String get(String key) {
                  return map.get(key);
              }

              public void put(String key, String type) {
                  map.put(key, type);
                  dirty = true;
              }

              public void remove(String key) {
                  if (map.remove(key) != null) {
                      dirty = true;
                  }
              }

              private String snapshot() {
                  StringBuilder sb = new StringBuilder();
                  for (Map.Entry<String, String> e : map.entrySet()) {
                      sb.append(e.getKey()).append('=').append(e.getValue()).append('\n');
                  }
                  return sb.toString();
              }

              /** Сохраняет, если были изменения (запись в отдельном потоке). */
              public void saveIfDirty() {
                  if (!dirty) {
                      return;
                  }
                  dirty = false;
                  final String data = snapshot();
                  Thread t = new Thread(() -> write(data), "EclipsCustom-save");
                  t.setDaemon(true);
                  t.start();
              }

              /** Синхронное сохранение (при выключении сервера). */
              public void saveNow() {
                  dirty = false;
                  write(snapshot());
              }

              private void write(String data) {
                  synchronized (ioLock) {
                      try {
                          File tmp = new File(file.getParentFile(), "placed.tmp");
                          Files.write(tmp.toPath(), data.getBytes(StandardCharsets.UTF_8));
                          try {
                              Files.move(tmp.toPath(), file.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE);
                          } catch (Throwable moveFail) {
                              Files.move(tmp.toPath(), file.toPath(), StandardCopyOption.REPLACE_EXISTING);
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              }
          }
          EOF_PLACEDSTORE

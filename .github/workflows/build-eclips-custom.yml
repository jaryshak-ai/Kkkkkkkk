name: Build EclipsCustom

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project files
        run: |
          set -e
          mkdir -p "$(dirname 'pom.xml')"
          cat > 'pom.xml' <<'EOF_POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.eclips</groupId>
            <artifactId>EclipsCustom</artifactId>
            <version>1.0.0</version>
            <packaging>jar</packaging>
            <properties>
              <maven.compiler.source>17</maven.compiler.source>
              <maven.compiler.target>17</maven.compiler.target>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              <nk.group>cn.nukkit</nk.group>
              <nk.artifact>Nukkit</nk.artifact>
              <nk.version>MOT-SNAPSHOT</nk.version>
            </properties>
            <repositories>
              <repository>
                <id>lanink</id>
                <url>https://repo.lanink.cn/repository/maven-public/</url>
              </repository>
              <repository>
                <id>opencollab-snapshot</id>
                <url>https://repo.opencollab.dev/maven-snapshots/</url>
              </repository>
              <repository>
                <id>opencollab-release</id>
                <url>https://repo.opencollab.dev/maven-releases/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>${nk.group}</groupId>
                <artifactId>${nk.artifact}</artifactId>
                <version>${nk.version}</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <finalName>EclipsCustom</finalName>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.11.0</version>
                  <configuration>
                    <source>17</source>
                    <target>17</target>
                    <encoding>UTF-8</encoding>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF_POM
          mkdir -p "$(dirname 'src/main/resources/plugin.yml')"
          cat > 'src/main/resources/plugin.yml' <<'EOF_PLUGIN'
          name: EclipsCustom
          main: ru.eclips.custom.EclipsCustom
          version: 1.0.0
          api: ["1.0.0"]
          author: Eclips
          description: Кастомные крафты (ТНТ, элитры) и кристаллы
          commands:
            custom:
              description: "Кастомные крафты"
              usage: "/custom"
              permission: eclips.custom.use
            customg:
              description: "Админ-меню кастом предметов"
              usage: "/customg"
              permission: eclips.custom.admin
          permissions:
            eclips.custom.use:
              description: "Открывать список кастом крафтов"
              default: true
            eclips.custom.admin:
              description: "Выдача кастом предметов, /customg, /custom give, /custom reload"
              default: op
          EOF_PLUGIN
          mkdir -p "$(dirname 'src/main/resources/config.yml')"
          cat > 'src/main/resources/config.yml' <<'EOF_CONFIG'
          # ============================================================
          #  EclipsCustom: кастомные крафты (/custom) и выдача (/customg)
          #  Цвета в текстах: & и код (&9 синий, &d розовый, &l жирный, &r сброс).
          #  После изменений: /custom reload (текстуры применяются после рестарта).
          # ============================================================

          # ---------------- Взрывы ----------------
          settings:
            # Шанс (в процентах) сломать КАЖДЫЙ открытый блок обсидиана в радиусе взрыва
            # (ТНТ разрушитель и подводный ТНТ).
            obsidian-chance: 15
            # Радиус обычного ТНТ (для обсидиана и подводных блоков).
            tnt-radius: 4
            # Огненный ТНТ: во сколько раз больше радиус взрыва.
            fire-multiplier: 2.0
            # Огненный ТНТ: шанс (%) поджечь подходящее место вокруг взрыва.
            fire-chance: 35
            # Огненный ТНТ: максимум блоков огня за один взрыв.
            fire-max-blocks: 300
            # Огненный ТНТ: сколько секунд горят существа рядом с взрывом.
            fire-entity-seconds: 6
            # Огненный ТНТ: через сколько тиков после взрыва ставится огонь.
            fire-delay-ticks: 2
            # Подводный ТНТ: радиус разрушения блоков под водой.
            underwater-radius: 4
            # Админ-меню /customg: сколько штук выдаётся при клике с приседанием.
            admin-sneak-amount: 16

          # ---------------- Названия меню ----------------
          menu:
            list-title: "&l&9Кастом крафты"
            recipe-title: "&l&9Рецепт крафта"
            admin-title: "&l&9Кастом предметы (админ)"

          # ---------------- Текстуры ----------------
          textures:
            # Создавать заглушки PNG в plugins/EclipsCustom/textures/ (уже существующие файлы не трогаются).
            enabled: true
            # Собирать ресурспак в папку сервера resource_packs/ (после первого создания нужен рестарт).
            build-pack: true
            pack-file: "EclipsCustom.zip"
            # Пробовать зарегистрировать кристаллы как настоящие кастом-предметы с текстурами.
            # Если ядро или сборка это не поддерживают, кристаллы будут обычными предметами-основами.
            custom-items: true

          # ---------------- Предметы ----------------
          # kind: breaker (разрушитель), underwater (подводный), fire (огненный), crystal (кристалл)
          # base-item: "имя|запасной id[:meta]". Если имя не подошло, берётся запасной id.
          # texture: имя файла textures/<texture>.png. Чтобы поставить свою текстуру, замени этот PNG
          #          и перезапусти сервер. Имена текстур кристаллов не меняй, меняй только сам PNG.
          # texture-color: цвет заглушки.
          # custom-id: id настоящего кастом-предмета (только для кристаллов), не меняй.
          # Текстуры ТНТ пока не используются: они появятся, когда будет выбран способ их показа.
          items:
            tnt_breaker:
              kind: breaker
              name: "&l&9ТНТ разрушитель"
              base-item: "minecraft:tnt|46"
              texture: "eclips_tnt_breaker"
              texture-color: "#D32F2F"
              lore:
                - "&9Взрыв с шансом {chance}% ломает обсидиан."
                - "&9Крафтится из ТНТ и кристалла разрушителя."

            tnt_underwater:
              kind: underwater
              name: "&l&9Подводный ТНТ"
              base-item: "minecraft:tnt|46"
              texture: "eclips_tnt_underwater"
              texture-color: "#1976D2"
              lore:
                - "&9Взрывается и наносит урон под водой."
                - "&9Ломает блоки под водой."
                - "&9С шансом {chance}% ломает обсидиан."
                - "&9Крафтится из ТНТ и кристалла воды."

            tnt_fire:
              kind: fire
              name: "&l&9Огненный ТНТ"
              base-item: "minecraft:tnt|46"
              texture: "eclips_tnt_fire"
              texture-color: "#F57C00"
              lore:
                - "&9Радиус взрыва x{multiplier}."
                - "&9Поджигает всё вокруг взрыва."
                - "&9Крафтится из ТНТ и кристалла огня."

            crystal_breaker:
              kind: crystal
              name: "&l&dКристалл разрушителя"
              base-item: "minecraft:amethyst_shard|388"
              custom-id: "eclips:crystal_breaker"
              texture: "eclips_crystal_breaker"
              texture-color: "#D81B60"
              lore:
                - "&dКристалл разрушителя подходит"
                - "&dдля крафта ТНТ разрушителя."

            crystal_water:
              kind: crystal
              name: "&l&dКристалл воды"
              base-item: "minecraft:prismarine_crystals|422"
              custom-id: "eclips:crystal_water"
              texture: "eclips_crystal_water"
              texture-color: "#039BE5"
              lore:
                - "&dКристалл воды подходит"
                - "&dдля крафта подводного ТНТ."

            crystal_fire:
              kind: crystal
              name: "&l&dКристалл огня"
              base-item: "minecraft:fire_charge|385"
              custom-id: "eclips:crystal_fire"
              texture: "eclips_crystal_fire"
              texture-color: "#FB8C00"
              lore:
                - "&dКристалл огня подходит"
                - "&dдля крафта огненного ТНТ."

          # ---------------- Рецепты ----------------
          # shape: 3 строки по 3 символа (пробел = пустая клетка).
          # ingredients: символ -> "custom:<id предмета из items>" или "имя|запасной id".
          # Крафт выполняется кнопкой в меню: ингредиенты берутся из инвентаря игрока.
          recipes:
            tnt_breaker:
              result: "custom:tnt_breaker"
              amount: 1
              shape:
                - "   "
                - " ab"
                - "   "
              ingredients:
                a: "minecraft:tnt|46"
                b: "custom:crystal_breaker"

            tnt_underwater:
              result: "custom:tnt_underwater"
              amount: 1
              shape:
                - "   "
                - " ab"
                - "   "
              ingredients:
                a: "minecraft:tnt|46"
                b: "custom:crystal_water"

            tnt_fire:
              result: "custom:tnt_fire"
              amount: 1
              shape:
                - "   "
                - " ab"
                - "   "
              ingredients:
                a: "minecraft:tnt|46"
                b: "custom:crystal_fire"

            elytra:
              result: "minecraft:elytra|444"
              amount: 1
              shape:
                - "a a"
                - "aba"
                - "a a"
              ingredients:
                a: "minecraft:feather|288"
                b: "minecraft:nether_star|399"
          EOF_CONFIG
          mkdir -p "$(dirname 'src/main/java/ru/eclips/custom/EclipsCustom.java')"
          cat > 'src/main/java/ru/eclips/custom/EclipsCustom.java' <<'EOF_ECLIPSCUSTOM'
          package ru.eclips.custom;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.item.Item;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.scheduler.PluginTask;

          import java.lang.reflect.Method;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          /**
           * EclipsCustom: кастомные крафты (/custom) и админ-меню предметов (/customg).
           */
          public class EclipsCustom extends PluginBase {

              private ItemRegistry items;
              private MenuManager menus;
              private PlacedStore store;
              private TntListener tnt;
              private final Map<String, Class<?>> customClasses = new HashMap<>();
              private boolean customActive = false;

              public ItemRegistry items() {
                  return items;
              }

              public MenuManager menus() {
                  return menus;
              }

              public PlacedStore store() {
                  return store;
              }

              public boolean isCustomActive() {
                  return customActive;
              }

              public Class<?> customClass(String id) {
                  return customClasses.get(id);
              }

              @Override
              public void onLoad() {
                  try {
                      saveDefaultConfig();
                  } catch (Throwable ignored) {
                  }
                  try {
                      new TexturePack(this).prepare();
                  } catch (Throwable t) {
                      getLogger().warning("Textures: " + t);
                  }
                  try {
                      registerCustomItems();
                  } catch (Throwable t) {
                      getLogger().warning("Custom items: " + t);
                  }
              }

              /**
               * Пробуем зарегистрировать кристаллы как настоящие кастом-предметы (с текстурами).
               * Если в сборке нет нужных классов или ядро не поддерживает, остаются базовые предметы.
               */
              private void registerCustomItems() {
                  if (!getConfig().getBoolean("textures.custom-items", true)) {
                      return;
                  }
                  String[][] pairs = {
                          {"eclips:crystal_breaker", "CrystalBreakerItem"},
                          {"eclips:crystal_fire", "CrystalFireItem"},
                          {"eclips:crystal_water", "CrystalWaterItem"}
                  };
                  int ok = 0;
                  for (String[] p : pairs) {
                      try {
                          Class<?> c = Class.forName("ru.eclips.custom.ci." + p[1]);
                          if (invokeRegister(c)) {
                              customClasses.put(p[0], c);
                              ok++;
                          }
                      } catch (Throwable ignored) {
                      }
                  }
                  customActive = ok > 0;
              }

              private boolean invokeRegister(Class<?> c) {
                  for (Method m : Item.class.getMethods()) {
                      if (!m.getName().equals("registerCustomItem") || m.getParameterCount() != 1) {
                          continue;
                      }
                      try {
                          Class<?> pt = m.getParameterTypes()[0];
                          Object res;
                          if (pt == Class.class) {
                              res = m.invoke(null, c);
                          } else if (List.class.isAssignableFrom(pt)) {
                              res = m.invoke(null, Collections.singletonList(c));
                          } else {
                              continue;
                          }
                          if (res != null) {
                              try {
                                  Object okv = res.getClass().getMethod("ok").invoke(res);
                                  if (okv instanceof Boolean) {
                                      return (Boolean) okv;
                                  }
                              } catch (Throwable ignored) {
                              }
                          }
                          return true;
                      } catch (Throwable ignored) {
                      }
                  }
                  return false;
              }

              @Override
              public void onEnable() {
                  try {
                      saveDefaultConfig();
                  } catch (Throwable ignored) {
                  }
                  store = new PlacedStore(this);
                  store.load();
                  items = new ItemRegistry(this);
                  items.load(getConfig());
                  menus = new MenuManager(this);
                  getServer().getPluginManager().registerEvents(new MenuListener(this), this);
                  tnt = new TntListener(this);
                  getServer().getPluginManager().registerEvents(tnt, this);
                  tnt.hookPrimeEvent();
                  try {
                      getServer().getScheduler().scheduleRepeatingTask(new PluginTask<EclipsCustom>(this) {
                          @Override
                          public void onRun(int currentTick) {
                              store.saveIfDirty();
                              tnt.cleanup();
                          }
                      }, 600);
                  } catch (Throwable ignored) {
                  }
                  getLogger().info("EclipsCustom: рецептов " + items.recipes().size() + ", предметов " + items.defs().size()
                          + ", кастом-предметы с текстурами: " + (customActive ? "ВКЛ" : "выкл")
                          + ", усиление огненного ТНТ: " + (tnt.isPrimeHooked() ? "штатно" : "запасной вариант"));
              }

              @Override
              public void onDisable() {
                  try {
                      if (store != null) {
                          store.saveNow();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public boolean isAdmin(CommandSender s) {
                  if (!(s instanceof Player)) {
                      return true;
                  }
                  return s.hasPermission("eclips.custom.admin") || s.isOp();
              }

              /** Выдаёт кастом-предмет игроку; что не влезло, падает на землю. */
              public boolean giveTo(Player target, String id, int amount) {
                  Item it = items.build(id, Math.max(1, amount));
                  if (it == null) {
                      return false;
                  }
                  Item[] left = target.getInventory().addItem(it);
                  if (left != null) {
                      for (Item l : left) {
                          if (l != null && !l.isNull()) {
                              target.getLevel().dropItem(target, l);
                          }
                      }
                  }
                  return true;
              }

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  String name = command.getName().toLowerCase();

                  if (name.equals("customg")) {
                      if (!isAdmin(sender)) {
                          sender.sendMessage(ItemUtil.c("&l&cУ тебя нет прав на эту команду."));
                          return true;
                      }
                      if (!(sender instanceof Player)) {
                          sender.sendMessage("Эту команду можно использовать только в игре.");
                          return true;
                      }
                      menus.openAdmin((Player) sender);
                      return true;
                  }

                  if (!name.equals("custom")) {
                      return false;
                  }

                  if (args.length == 0 || !isAdmin(sender)) {
                      if (sender instanceof Player) {
                          menus.openList((Player) sender);
                      } else {
                          sender.sendMessage("Эту команду можно использовать только в игре.");
                      }
                      return true;
                  }

                  String sub = args[0].toLowerCase();
                  if (sub.equals("reload")) {
                      try {
                          reloadConfig();
                          items.load(getConfig());
                          sender.sendMessage(ItemUtil.c("&l&aEclipsCustom: настройки перезагружены."));
                      } catch (Throwable t) {
                          sender.sendMessage(ItemUtil.c("&l&cНе получилось перезагрузить настройки."));
                      }
                      return true;
                  }

                  if (sub.equals("give")) {
                      if (args.length < 3) {
                          sender.sendMessage(ItemUtil.c("&9Использование: /custom give <игрок> <предмет> [кол-во]"));
                          StringBuilder sb = new StringBuilder();
                          for (ItemDef d : items.defs()) {
                              if (sb.length() > 0) {
                                  sb.append(", ");
                              }
                              sb.append(d.id);
                          }
                          sender.sendMessage(ItemUtil.c("&9Предметы: " + sb));
                          return true;
                      }
                      Player target = getServer().getPlayer(args[1]);
                      if (target == null) {
                          sender.sendMessage(ItemUtil.c("&l&cИгрок не найден."));
                          return true;
                      }
                      int amount = 1;
                      if (args.length > 3) {
                          try {
                              amount = Math.max(1, Math.min(2304, Integer.parseInt(args[3])));
                          } catch (NumberFormatException ex) {
                              amount = 1;
                          }
                      }
                      if (giveTo(target, args[2].toLowerCase(), amount)) {
                          sender.sendMessage(ItemUtil.c("&l&aВыдано: &r&9" + args[2] + " x" + amount + " игроку " + target.getName()));
                      } else {
                          sender.sendMessage(ItemUtil.c("&l&cТакого предмета нет."));
                      }
                      return true;
                  }

                  if (sender instanceof Player) {
                      menus.openList((Player) sender);
                  }
                  return true;
              }
          }
          EOF_ECLIPSCUSTOM
          mkdir -p "$(dirname 'src/main/java/ru/eclips/custom/ItemDef.java')"
          cat > 'src/main/java/ru/eclips/custom/ItemDef.java' <<'EOF_ITEMDEF'
          package ru.eclips.custom;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Описание кастом-предмета из config.yml (раздел items).
           */
          public class ItemDef {

              public String id;
              /** breaker, underwater, fire или crystal. */
              public String kind = "crystal";
              public String name = "";
              /** Базовый предмет, например "minecraft:tnt|46". */
              public String base = "";
              /** Id настоящего кастом-предмета (если удалось зарегистрировать), например "eclips:crystal_breaker". */
              public String customId = "";
              public String texture = "";
              public List<String> lore = new ArrayList<>();

              public boolean isTnt() {
                  return "breaker".equals(kind) || "underwater".equals(kind) || "fire".equals(kind);
              }
          }
          EOF_ITEMDEF
          mkdir -p "$(dirname 'src/main/java/ru/eclips/custom/ItemRegistry.java')"
          cat > 'src/main/java/ru/eclips/custom/ItemRegistry.java' <<'EOF_ITEMREGISTRY'
          package ru.eclips.custom;

          import cn.nukkit.item.Item;
          import cn.nukkit.utils.Config;
          import cn.nukkit.utils.ConfigSection;

          import java.util.Collection;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;

          /**
           * Хранит кастом-предметы и рецепты, читает их из config.yml.
           */
          public class ItemRegistry {

              private final EclipsCustom plugin;
              private final Map<String, ItemDef> defs = new LinkedHashMap<>();
              private final Map<String, RecipeDef> recipes = new LinkedHashMap<>();

              public ItemRegistry(EclipsCustom plugin) {
                  this.plugin = plugin;
              }

              public void load(Config cfg) {
                  defs.clear();
                  recipes.clear();

                  ConfigSection items = cfg.getSection("items");
                  if (items != null) {
                      for (String id : items.getKeys(false)) {
                          try {
                              ConfigSection s = items.getSection(id);
                              if (s == null) {
                                  continue;
                              }
                              ItemDef d = new ItemDef();
                              d.id = id;
                              d.kind = s.getString("kind", "crystal");
                              d.name = s.getString("name", id);
                              d.base = s.getString("base-item", "minecraft:stone|1");
                              d.customId = s.getString("custom-id", "");
                              d.texture = s.getString("texture", "");
                              d.lore = s.getStringList("lore");
                              defs.put(id, d);
                          } catch (Throwable ignored) {
                          }
                      }
                  }

                  ConfigSection rs = cfg.getSection("recipes");
                  if (rs != null) {
                      for (String id : rs.getKeys(false)) {
                          try {
                              RecipeDef r = readRecipe(id, rs.getSection(id));
                              if (r != null) {
                                  recipes.put(id, r);
                              }
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }

              private RecipeDef readRecipe(String id, ConfigSection s) {
                  if (s == null) {
                      return null;
                  }
                  RecipeDef r = new RecipeDef();
                  r.id = id;
                  r.resultSpec = s.getString("result", "");
                  r.amount = Math.max(1, s.getInt("amount", 1));
                  List<String> shape = s.getStringList("shape");
                  ConfigSection ing = s.getSection("ingredients");
                  Map<String, RecipeDef.Ing> byKey = new HashMap<>();
                  for (int row = 0; row < 3; row++) {
                      String line = row < shape.size() ? shape.get(row) : "";
                      if (line == null) {
                          line = "";
                      }
                      for (int col = 0; col < 3; col++) {
                          if (col >= line.length()) {
                              continue;
                          }
                          char ch = line.charAt(col);
                          if (ch == ' ') {
                              continue;
                          }
                          String key = String.valueOf(ch);
                          RecipeDef.Ing g = byKey.get(key);
                          if (g == null) {
                              String spec = ing == null ? "" : ing.getString(key, "");
                              if (spec == null || spec.isEmpty()) {
                                  continue;
                              }
                              g = new RecipeDef.Ing();
                              if (spec.startsWith("custom:")) {
                                  g.custom = spec.substring("custom:".length()).trim();
                              } else {
                                  g.vanilla = ItemUtil.parse(spec, 1);
                              }
                              byKey.put(key, g);
                              r.ings.add(g);
                          }
                          g.total++;
                          r.grid[row][col] = g;
                      }
                  }
                  if (r.ings.isEmpty() || r.resultSpec.isEmpty()) {
                      return null;
                  }
                  return r;
              }

              public ItemDef def(String id) {
                  return id == null ? null : defs.get(id);
              }

              public Collection<ItemDef> defs() {
                  return defs.values();
              }

              public RecipeDef recipe(String id) {
                  return id == null ? null : recipes.get(id);
              }

              public Collection<RecipeDef> recipes() {
                  return recipes.values();
              }

              /** Создаёт готовый кастом-предмет по id из config.yml. */
              public Item build(String id, int count) {
                  ItemDef d = defs.get(id);
                  if (d == null) {
                      return null;
                  }
                  Item it = null;
                  if (plugin.isCustomActive() && d.customId != null && !d.customId.isEmpty()) {
                      Class<?> c = plugin.customClass(d.customId);
                      if (c != null) {
                          try {
                              it = (Item) c.getDeclaredConstructor().newInstance();
                          } catch (Throwable ignored) {
                              it = null;
                          }
                      }
                  }
                  if (it == null) {
                      it = ItemUtil.parse(d.base, 1);
                  }
                  it.setCount(Math.max(1, count));
                  it.setCustomName(ItemUtil.c(d.name));
                  it.setLore(ItemUtil.lore(d.lore, plugin.getConfig()));
                  return ItemUtil.mark(it, id);
              }

              /** Результат рецепта. */
              public Item buildResult(RecipeDef r) {
                  Item it;
                  if (r.resultSpec.startsWith("custom:")) {
                      it = build(r.resultSpec.substring("custom:".length()).trim(), r.amount);
                      if (it == null) {
                          it = ItemUtil.parse("minecraft:stone|1", r.amount);
                      }
                  } else {
                      it = ItemUtil.parse(r.resultSpec, r.amount);
                  }
                  return it;
              }

              /** Предмет для показа ингредиента в меню (1 шт.). */
              public Item displayIng(RecipeDef.Ing g) {
                  Item it = null;
                  if (g.custom != null) {
                      it = build(g.custom, 1);
                  } else if (g.vanilla != null) {
                      it = g.vanilla.clone();
                      it.setCount(1);
                  }
                  if (it == null) {
                      it = ItemUtil.parse("minecraft:barrier|416", 1);
                  }
                  return it;
              }
          }
          EOF_ITEMREGISTRY

          mkdir -p "$(dirname 'src/main/java/ru/eclips/custom/MenuManager.java')"
          cat > 'src/main/java/ru/eclips/custom/MenuManager.java' <<'EOF_MENUMANAGER'
          package ru.eclips.custom;

          import cn.nukkit.Player;
          import cn.nukkit.inventory.PlayerInventory;
          import cn.nukkit.item.Item;
          import cn.nukkit.scheduler.PluginTask;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          /**
           * Меню плагина: список крафтов (/custom), меню верстака с рецептом и
           * админ-меню выдачи (/customg). Всё на виртуальных сундуках.
           */
          public class MenuManager {

              public static final int SLOT_ARROW = 13;
              public static final int SLOT_RESULT = 15;
              public static final int SLOT_CRAFT = 24;
              public static final int SLOT_BACK = 26;

              private static final int[] LIST_SLOTS = {10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25};

              private final EclipsCustom plugin;
              private final Map<UUID, MenuInventory> open = new HashMap<>();
              private final Map<UUID, Long> lastClick = new HashMap<>();

              public MenuManager(EclipsCustom plugin) {
                  this.plugin = plugin;
              }

              // ------------------------------------------------------------------ служебное

              private void later(int ticks, final Runnable r) {
                  try {
                      plugin.getServer().getScheduler().scheduleDelayedTask(new PluginTask<EclipsCustom>(plugin) {
                          @Override
                          public void onRun(int currentTick) {
                              try {
                                  r.run();
                              } catch (Throwable ignored) {
                              }
                          }
                      }, ticks);
                  } catch (Throwable ignored) {
                  }
              }

              private MenuInventory create(Player p, String kind, String title) {
                  int x = p.getFloorX();
                  int z = p.getFloorZ();
                  int y = p.getFloorY() + 3;
                  if (y > 300) {
                      y = p.getFloorY() - 3;
                  }
                  MenuInventory.Holder h = new MenuInventory.Holder(x, y, z);
                  return new MenuInventory(h, p.getLevel(), kind, ItemUtil.c(title), this);
              }

              private Item pane() {
                  Item it = ItemUtil.parse("minecraft:gray_stained_glass_pane|160:7", 1);
                  it.setCustomName(ItemUtil.c("&r "));
                  return it;
              }

              private Item button(String spec, String name, String... lore) {
                  Item it = ItemUtil.parse(spec, 1);
                  it.setCustomName(ItemUtil.c(name));
                  if (lore != null && lore.length > 0) {
                      String[] l = new String[lore.length];
                      for (int i = 0; i < lore.length; i++) {
                          l[i] = ItemUtil.c(lore[i]);
                      }
                      it.setLore(l);
                  }
                  return it;
              }

              private void fillPanes(MenuInventory m) {
                  Item pane = pane();
                  for (int i = 0; i < 27; i++) {
                      m.setItem(i, pane.clone());
                  }
              }

              /** Закрывает старое меню (если есть) и открывает новое с задержкой, чтобы клиент успел получить сундук. */
              private void show(final Player p, final MenuInventory inv) {
                  if (p == null || !p.isOnline()) {
                      return;
                  }
                  final UUID id = p.getUniqueId();
                  MenuInventory old = open.remove(id);
                  if (old != null) {
                      try {
                          p.removeWindow(old);
                      } catch (Throwable ignored) {
                      }
                  }
                  open.put(id, inv);
                  inv.placeFake(p);
                  later(2, new Runnable() {
                      @Override
                      public void run() {
                          if (open.get(id) == inv && p.isOnline()) {
                              inv.placeFake(p);
                          }
                      }
                  });
                  later(5, new Runnable() {
                      @Override
                      public void run() {
                          if (open.get(id) != inv || !p.isOnline()) {
                              return;
                          }
                          try {
                              int w = p.addWindow(inv);
                              if (w < 0) {
                                  open.remove(id);
                                  inv.restore(p);
                              }
                          } catch (Throwable t) {
                              open.remove(id);
                              inv.restore(p);
                          }
                      }
                  });
              }

              public void closed(Player p, MenuInventory inv) {
                  try {
                      UUID id = p.getUniqueId();
                      if (open.get(id) == inv) {
                          open.remove(id);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public void quit(Player p) {
                  UUID id = p.getUniqueId();
                  open.remove(id);
                  lastClick.remove(id);
              }

              // ------------------------------------------------------------------ меню

              /** /custom: список всех кастом крафтов. */
              public void openList(Player p) {
                  MenuInventory m = create(p, "list", plugin.getConfig().getString("menu.list-title", "&l&9Кастом крафты"));
                  fillPanes(m);
                  int i = 0;
                  for (RecipeDef r : plugin.items().recipes()) {
                      if (i >= LIST_SLOTS.length) {
                          break;
                      }
                      Item it = plugin.items().buildResult(r);
                      ItemUtil.addLore(it, ItemUtil.c("&r "), ItemUtil.c("&9Нажми, чтобы посмотреть рецепт"));
                      m.setItem(LIST_SLOTS[i], it);
                      m.slotMap.put(LIST_SLOTS[i], r.id);
                      i++;
                  }
                  show(p, m);
              }

              /** Меню верстака с рецептом. */
              public void openRecipe(Player p, RecipeDef r) {
                  MenuInventory m = create(p, "recipe", plugin.getConfig().getString("menu.recipe-title", "&l&9Рецепт крафта"));
                  m.data = r.id;
                  fillRecipe(m, p, r);
                  show(p, m);
              }

              /** /customg: меню выдачи всех кастом предметов (для админов). */
              public void openAdmin(Player p) {
                  MenuInventory m = create(p, "admin", plugin.getConfig().getString("menu.admin-title", "&l&9Кастом предметы (админ)"));
                  fillPanes(m);
                  int sneak = plugin.getConfig().getInt("settings.admin-sneak-amount", 16);
                  int i = 0;
                  for (ItemDef d : plugin.items().defs()) {
                      if (i >= LIST_SLOTS.length) {
                          break;
                      }
                      Item it = plugin.items().build(d.id, 1);
                      if (it == null) {
                          continue;
                      }
                      ItemUtil.addLore(it, ItemUtil.c("&r "), ItemUtil.c("&9Нажми: взять 1 шт."), ItemUtil.c("&9С приседанием: взять " + sneak + " шт."));
                      m.setItem(LIST_SLOTS[i], it);
                      m.slotMap.put(LIST_SLOTS[i], d.id);
                      i++;
                  }
                  show(p, m);
              }

              private int count(PlayerInventory inv, RecipeDef.Ing g) {
                  int n = 0;
                  for (Item it : inv.getContents().values()) {
                      if (g.matches(it)) {
                          n += it.getCount();
                      }
                  }
                  return n;
              }

              private void remove(PlayerInventory inv, RecipeDef.Ing g, int amount) {
                  int left = amount;
                  for (Map.Entry<Integer, Item> e : inv.getContents().entrySet()) {
                      if (left <= 0) {
                          break;
                      }
                      Item it = e.getValue();
                      if (!g.matches(it)) {
                          continue;
                      }
                      int take = Math.min(left, it.getCount());
                      if (take >= it.getCount()) {
                          inv.clear(e.getKey());
                      } else {
                          Item c = it.clone();
                          c.setCount(it.getCount() - take);
                          inv.setItem(e.getKey(), c);
                      }
                      left -= take;
                  }
              }

              /** Заполняет (или обновляет) меню верстака. */
              private void fillRecipe(MenuInventory m, Player p, RecipeDef r) {
                  Item pane = pane();
                  for (int i = 0; i < 27; i++) {
                      m.setItem(i, pane.clone());
                  }
                  PlayerInventory inv = p.getInventory();
                  Map<RecipeDef.Ing, Integer> have = new HashMap<>();
                  boolean can = true;
                  for (RecipeDef.Ing g : r.ings) {
                      int h = count(inv, g);
                      have.put(g, h);
                      if (h < g.total) {
                          can = false;
                      }
                  }
                  for (int row = 0; row < 3; row++) {
                      for (int col = 0; col < 3; col++) {
                          int slot = row * 9 + col + 1;
                          RecipeDef.Ing g = r.grid[row][col];
                          if (g == null) {
                              m.setItem(slot, Item.get(0));
                              continue;
                          }
                          Item d = plugin.items().displayIng(g);
                          int h = have.get(g);
                          String color = h >= g.total ? "&a" : "&c";
                          ItemUtil.addLore(d, ItemUtil.c("&r "), ItemUtil.c("&9Нужно всего: &l" + g.total), ItemUtil.c(color + "У тебя: &l" + h));
                          m.setItem(slot, d);
                      }
                  }
                  m.setItem(SLOT_ARROW, button("minecraft:arrow|262", "&l&9Крафт \u2192"));
                  Item res = plugin.items().buildResult(r);
                  ItemUtil.addLore(res, ItemUtil.c("&r "), ItemUtil.c("&9Результат крафта"));
                  m.setItem(SLOT_RESULT, res);
                  if (can) {
                      m.setItem(SLOT_CRAFT, button("minecraft:crafting_table|58", "&l&aСкрафтить", "&9Нажми, чтобы скрафтить."));
                  } else {
                      m.setItem(SLOT_CRAFT, button("minecraft:crafting_table|58", "&l&cНе хватает ингредиентов", "&9Красное число: сколько не хватает."));
                  }
                  m.setItem(SLOT_BACK, button("minecraft:barrier|416", "&l&9\u00ab Назад к списку"));
              }

              // ------------------------------------------------------------------ клики

              public void click(final Player p, MenuInventory m, int slot) {
                  try {
                      UUID id = p.getUniqueId();
                      long now = System.currentTimeMillis();
                      Long last = lastClick.get(id);
                      if (last != null && now - last < 250L) {
                          return;
                      }
                      lastClick.put(id, now);

                      String data = m.slotMap.get(slot);
                      if ("list".equals(m.kind)) {
                          if (data != null) {
                              final RecipeDef r = plugin.items().recipe(data);
                              if (r != null) {
                                  later(1, new Runnable() {
                                      @Override
                                      public void run() {
                                          openRecipe(p, r);
                                      }
                                  });
                              }
                          }
                      } else if ("recipe".equals(m.kind)) {
                          RecipeDef r = plugin.items().recipe(m.data);
                          if (r == null) {
                              return;
                          }
                          if (slot == SLOT_BACK) {
                              later(1, new Runnable() {
                                  @Override
                                  public void run() {
                                      openList(p);
                                  }
                              });
                          } else if (slot == SLOT_CRAFT) {
                              craft(p, r);
                              fillRecipe(m, p, r);
                          }
                      } else if ("admin".equals(m.kind)) {
                          if (data != null && plugin.isAdmin(p)) {
                              int amount = p.isSneaking() ? plugin.getConfig().getInt("settings.admin-sneak-amount", 16) : 1;
                              plugin.giveTo(p, data, amount);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
              }

              /** Крафт: забирает ингредиенты из инвентаря и выдаёт результат. */
              private void craft(Player p, RecipeDef r) {
                  PlayerInventory inv = p.getInventory();
                  for (RecipeDef.Ing g : r.ings) {
                      if (count(inv, g) < g.total) {
                          p.sendMessage(ItemUtil.c("&l&cНе хватает ингредиентов для крафта."));
                          return;
                      }
                  }
                  for (RecipeDef.Ing g : r.ings) {
                      remove(inv, g, g.total);
                  }
                  Item res = plugin.items().buildResult(r);
                  String name = res.hasCustomName() ? res.getCustomName() : res.getName();
                  Item[] left = inv.addItem(res);
                  if (left != null) {
                      for (Item i : left) {
                          if (i != null && !i.isNull()) {
                              p.getLevel().dropItem(p, i);
                          }
                      }
                  }
                  p.sendMessage(ItemUtil.c("&l&aГотово! &r&9Скрафчено: &r") + name);
              }
          }
          EOF_MENUMANAGER

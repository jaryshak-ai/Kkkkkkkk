          cat > 'src/main/java/ru/eclips/custom/ItemUtil.java' <<'EOF_ITEMUTIL'
          package ru.eclips.custom;

          import cn.nukkit.item.Item;
          import cn.nukkit.nbt.tag.CompoundTag;
          import cn.nukkit.utils.Config;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Вспомогательные методы: цвета, разбор предметов, метка кастом-предмета в NBT.
           */
          public final class ItemUtil {

              /** Ключ NBT, по которому плагин узнаёт свои предметы. */
              public static final String TAG = "eclips_custom";

              private ItemUtil() {
              }

              /** Заменяет & на знак цвета. */
              public static String c(String s) {
                  if (s == null) {
                      return "";
                  }
                  return s.replace('&', '\u00a7');
              }

              private static String num(double d) {
                  if (d == Math.floor(d)) {
                      return String.valueOf((int) d);
                  }
                  return String.valueOf(d);
              }

              /** Описание предмета: подставляет {chance}, {multiplier}, {radius} и цвета. */
              public static String[] lore(List<String> lines, Config cfg) {
                  List<String> out = new ArrayList<>();
                  if (lines != null) {
                      for (String l : lines) {
                          String s = l == null ? "" : l;
                          s = s.replace("{chance}", num(cfg.getDouble("settings.obsidian-chance", 15)));
                          s = s.replace("{multiplier}", num(cfg.getDouble("settings.fire-multiplier", 2.0)));
                          s = s.replace("{radius}", num(cfg.getDouble("settings.tnt-radius", 4)));
                          out.add(c(s));
                      }
                  }
                  return out.toArray(new String[0]);
              }

              /**
               * Разбор предмета из строки вида "minecraft:tnt|46" или "minecraft:glass|20:0".
               * Сначала пробуем имя, потом числовой запасной id, в конце камень.
               */
              public static Item parse(String spec, int count) {
                  String name = spec == null ? "" : spec.trim();
                  String fb = null;
                  int bar = name.indexOf('|');
                  if (bar >= 0) {
                      fb = name.substring(bar + 1).trim();
                      name = name.substring(0, bar).trim();
                  }
                  Item it = null;
                  if (!name.isEmpty()) {
                      try {
                          it = Item.fromString(name);
                      } catch (Throwable ignored) {
                          it = null;
                      }
                  }
                  if (it == null || it.getId() == 0) {
                      it = null;
                      if (fb != null && !fb.isEmpty()) {
                          try {
                              String[] p = fb.split(":");
                              int id = Integer.parseInt(p[0].trim());
                              int meta = p.length > 1 ? Integer.parseInt(p[1].trim()) : 0;
                              it = Item.get(id, meta, 1);
                          } catch (Throwable ignored) {
                              it = null;
                          }
                      }
                  }
                  if (it == null || it.getId() == 0) {
                      it = Item.get(1, 0, 1);
                  }
                  it = it.clone();
                  it.setCount(Math.max(1, count));
                  return it;
              }

              /** Возвращает id кастом-предмета из NBT или null. */
              public static String typeOf(Item item) {
                  try {
                      if (item == null || item.isNull() || !item.hasCompoundTag()) {
                          return null;
                      }
                      CompoundTag t = item.getNamedTag();
                      if (t == null || !t.contains(TAG)) {
                          return null;
                      }
                      String v = t.getString(TAG);
                      return v == null || v.isEmpty() ? null : v;
                  } catch (Throwable ignored) {
                      return null;
                  }
              }

              /** Ставит метку кастом-предмета. */
              public static Item mark(Item item, String id) {
                  CompoundTag t = item.hasCompoundTag() ? item.getNamedTag() : new CompoundTag();
                  t.putString(TAG, id);
                  item.setNamedTag(t);
                  return item;
              }

              /** Добавляет строки в конец описания. */
              public static void addLore(Item it, String... extra) {
                  List<String> l = new ArrayList<>();
                  try {
                      String[] old = it.getLore();
                      if (old != null) {
                          for (String s : old) {
                              l.add(s);
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  for (String s : extra) {
                      l.add(s);
                  }
                  it.setLore(l.toArray(new String[0]));
              }
          }
          EOF_ITEMUTIL
          mkdir -p "$(dirname 'src/main/java/ru/eclips/custom/MenuInventory.java')"
          cat > 'src/main/java/ru/eclips/custom/MenuInventory.java' <<'EOF_MENUINVENTORY'
          package ru.eclips.custom;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.inventory.ContainerInventory;
          import cn.nukkit.inventory.Inventory;
          import cn.nukkit.inventory.InventoryHolder;
          import cn.nukkit.inventory.InventoryType;
          import cn.nukkit.level.Level;
          import cn.nukkit.math.Vector3;
          import cn.nukkit.nbt.NBTIO;
          import cn.nukkit.nbt.tag.CompoundTag;
          import cn.nukkit.network.protocol.DataPacket;

          import java.lang.reflect.Method;
          import java.nio.ByteOrder;
          import java.util.HashMap;
          import java.util.Map;

          /**
           * Виртуальный сундук (27 слотов). Над головой игрока на время меню подменяется
           * блок на сундук (виден только этому игроку), при закрытии возвращается настоящий блок.
           */
          public class MenuInventory extends ContainerInventory {

              /** Владелец инвентаря (точка, где стоит "фальшивый" сундук). */
              public static class Holder extends Vector3 implements InventoryHolder {
                  private MenuInventory inv;

                  public Holder(int x, int y, int z) {
                      super(x, y, z);
                  }

                  @Override
                  public Inventory getInventory() {
                      return inv;
                  }
              }

              /** Тип меню: list, recipe, admin. */
              public final String kind;
              /** Дополнительные данные (для рецепта это id рецепта). */
              public String data = "";
              /** Слот -> id (рецепта или предмета). */
              public final Map<Integer, String> slotMap = new HashMap<>();

              private final Level level;
              private final int bx;
              private final int by;
              private final int bz;
              private final String title;
              private final MenuManager manager;

              public MenuInventory(Holder holder, Level level, String kind, String title, MenuManager manager) {
                  super(holder, InventoryType.CHEST);
                  holder.inv = this;
                  this.level = level;
                  this.kind = kind;
                  this.title = title;
                  this.manager = manager;
                  this.bx = holder.getFloorX();
                  this.by = holder.getFloorY();
                  this.bz = holder.getFloorZ();
              }

              /** Показывает игроку фальшивый сундук и его название. */
              public void placeFake(Player p) {
                  try {
                      Block b = Block.get(54);
                      b.x = bx;
                      b.y = by;
                      b.z = bz;
                      b.level = level;
                      sendBlock(p, b);
                  } catch (Throwable ignored) {
                  }
                  sendName(p);
              }

              /** Возвращает игроку настоящий блок на месте фальшивого сундука. */
              public void restore(Player p) {
                  try {
                      Block real = level.getBlock(new Vector3(bx, by, bz));
                      sendBlock(p, real);
                  } catch (Throwable ignored) {
                  }
              }

              private void sendBlock(Player p, Vector3 v) throws Exception {
                  Method m = level.getClass().getMethod("sendBlocks", Player[].class, Vector3[].class);
                  m.invoke(level, new Player[]{p}, new Vector3[]{v});
              }

              /** Название сундука (через данные блока-сущности), ошибки игнорируем. */
              private void sendName(Player p) {
                  try {
                      CompoundTag tag = new CompoundTag()
                              .putString("id", "Chest")
                              .putInt("x", bx)
                              .putInt("y", by)
                              .putInt("z", bz)
                              .putString("CustomName", title);
                      byte[] bytes = NBTIO.write(tag, ByteOrder.LITTLE_ENDIAN);
                      Class<?> pc = Class.forName("cn.nukkit.network.protocol.BlockEntityDataPacket");
                      Object pk = pc.getDeclaredConstructor().newInstance();
                      pc.getField("x").setInt(pk, bx);
                      pc.getField("y").setInt(pk, by);
                      pc.getField("z").setInt(pk, bz);
                      pc.getField("namedTag").set(pk, bytes);
                      p.dataPacket((DataPacket) pk);
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public void onClose(Player who) {
                  super.onClose(who);
                  restore(who);
                  if (manager != null) {
                      manager.closed(who, this);
                  }
              }
          }
          EOF_MENUINVENTORY
          mkdir -p "$(dirname 'src/main/java/ru/eclips/custom/MenuListener.java')"
